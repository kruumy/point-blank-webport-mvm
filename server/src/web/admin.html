<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PB Admin</title>
<style>
  :root { color-scheme: dark; --bg: #15171b; --panel: #1f2228; --line: #2e323a; --text: #e6e8eb; --dim: #8b919c; --accent: #e8a33d; --bad: #e5534b; --ok: #57ab5a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0 12px 0 0; }
  input, select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; }
  button { cursor: pointer; }
  a.btn { color: var(--text); text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; }
  a.btn:hover { border-color: var(--accent); }
  button:hover { border-color: var(--accent); }
  button.danger { color: var(--bad); }
  #q { flex: 1; max-width: 360px; }
  main { display: flex; align-items: flex-start; }
  #list { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--dim); font-weight: 500; position: sticky; top: 0; background: var(--bg); }
  tbody tr { cursor: pointer; }
  tbody tr:hover, tbody tr.sel { background: var(--panel); }
  .on { color: var(--ok); }
  #edit { width: 320px; padding: 16px; border-left: 1px solid var(--line); min-height: calc(100vh - 57px); }
  #edit[hidden] { display: none; }
  #edit h2 { font-size: 15px; margin: 0 0 4px; }
  #edit .sub { color: var(--dim); margin-bottom: 12px; }
  label { display: block; margin-bottom: 8px; color: var(--dim); }
  label input, label select { display: block; width: 100%; margin-top: 2px; }
  .row { display: flex; gap: 8px; margin: 12px 0; }
  .row > * { flex: 1; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
  #msg { min-height: 20px; margin-top: 8px; }
  #msg.err { color: var(--bad); }
  #msg.ok { color: var(--ok); }
  .note { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <a id="login" class="btn" href="/">&larr; Login</a>
  <h1>PB Admin</h1>
  <input id="q" type="search" placeholder="Search nickname, username or UID" autofocus>
  <button id="refresh">Refresh</button>
  <span class="note">Online players can't be edited: they save over the database when they log out.</span>
</header>
<main>
  <div id="list">
    <table>
      <thead><tr><th>UID</th><th>Nickname</th><th>Username</th><th>Rank</th><th>EXP</th><th>Gold</th><th>Cash</th><th>Tags</th><th>Access</th><th>Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <form id="edit" hidden>
    <h2 id="e-title"></h2>
    <div class="sub" id="e-sub"></div>
    <label>Nickname <input name="nickname" maxlength="16"></label>
    <label>Rank <input name="rank" type="number"></label>
    <label>Experience <input name="experience" type="number"></label>
    <label>Gold <input name="gold" type="number"></label>
    <label>Cash <input name="cash" type="number"></label>
    <label>Tags <input name="tags" type="number"></label>
    <label>Access level <select name="access_level"></select></label>
    <div class="row"><button type="submit">Save changes</button></div>
    <hr>
    <div class="row"><button type="button" id="unlock">Unlock all items</button></div>
    <div class="note">Every visible shop item as permanent, plus all characters. Coupons are left out.</div>
    <hr>
    <label>New password <input id="pw" type="password" minlength="6" maxlength="64" autocomplete="new-password"></label>
    <div class="row"><button type="button" id="setpw">Set password</button></div>
    <hr>
    <div class="row"><button type="button" class="danger" id="del">Delete account</button></div>
    <div id="msg"></div>
  </form>
</main>
<script>
const $ = (s) => document.querySelector(s);
// the game's login is the Vite page (port 8000), this panel is served by the game server (8090)
$("#login").href = `http://${location.hostname}:8000/`;
const form = $("#edit");
const NUM = ["rank", "experience", "gold", "cash", "tags", "access_level"];
const CLAMPED = ["experience", "gold", "cash", "tags"];
let accounts = [], levels = [], current = null, timer = 0;

async function api(method, path, body) {
  const r = await fetch("/admin/api/accounts" + path, {
    method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

function say(text, ok) { const m = $("#msg"); m.textContent = text; m.className = ok ? "ok" : "err"; }

async function load() {
  const data = await api("GET", "?q=" + encodeURIComponent($("#q").value.trim()));
  accounts = data.accounts; levels = data.levels;
  const tb = $("#rows");
  tb.replaceChildren();
  const name = (k) => levels.find((l) => l.key === k)?.name ?? k;
  for (const a of accounts) {
    const tr = document.createElement("tr");
    if (current && a.player_id === current.player_id) tr.className = "sel";
    for (const v of [a.player_id, a.nickname, a.username, a.rank, a.experience, a.gold, a.cash, a.tags, name(a.access_level), a.online ? "online" : "offline"]) {
      const td = document.createElement("td");
      td.textContent = v;
      tr.append(td);
    }
    if (a.online) tr.lastChild.className = "on";
    tr.onclick = () => open(a);
    tb.append(tr);
  }
  if (!accounts.length) tb.innerHTML = '<tr><td colspan="10" class="note">No accounts match.</td></tr>';
  if (current) { const a = accounts.find((x) => x.player_id === current.player_id); a ? open(a, true) : close(); }
}

function open(a, keepMsg) {
  current = a;
  form.hidden = false;
  $("#e-title").textContent = a.nickname || a.username;
  $("#e-sub").textContent = `UID ${a.player_id} · ${a.username} · ${a.online ? "online (read-only)" : "offline"}`;
  const sel = form.elements.access_level;
  sel.replaceChildren(...levels.map((l) => new Option(`${l.name} (${l.key})`, l.key)));
  for (const k of ["nickname", ...NUM]) form.elements[k].value = a[k];
  for (const el of form.elements) el.disabled = a.online;
  $("#pw").value = "";
  if (!keepMsg) say("");
  for (const tr of $("#rows").children) tr.classList.toggle("sel", tr.firstChild.textContent === a.player_id);
}

function close() { current = null; form.hidden = true; }

form.onsubmit = async (e) => {
  e.preventDefault();
  const body = {};
  for (const k of ["nickname", ...NUM]) {
    let v = k === "nickname" ? form.elements[k].value : Number(form.elements[k].value);
    // the columns are 32-bit: an out-of-range amount becomes the nearest allowed one
    if (CLAMPED.includes(k)) form.elements[k].value = v = Math.min(2147483647, Math.max(0, Math.trunc(v) || 0));
    if (String(v) !== String(current[k])) body[k] = v;
  }
  if (!Object.keys(body).length) return say("Nothing changed.", true);
  try { await api("PATCH", "/" + current.player_id, body); say("Saved.", true); await load(); }
  catch (err) { say(err.message); }
};

$("#setpw").onclick = async () => {
  try { await api("POST", `/${current.player_id}/password`, { password: $("#pw").value }); $("#pw").value = ""; say("Password changed.", true); }
  catch (err) { say(err.message); }
};

$("#unlock").onclick = async () => {
  try {
    const r = await api("POST", `/${current.player_id}/unlock-all`);
    say(`Unlocked: ${r.items} new items, ${r.madePermanent} made permanent, ${r.characters} characters.`, true);
  } catch (err) { say(err.message); }
};

$("#del").onclick = async () => {
  const nick = current.nickname || current.username;
  const typed = prompt(`Delete ${nick} (UID ${current.player_id}) and everything it owns? This cannot be undone.\n\nType the nickname to confirm:`);
  if (typed === null) return;
  if (typed !== nick) return say("Nickname didn't match, nothing deleted.");
  try {
    const { removed } = await api("DELETE", "/" + current.player_id);
    close();
    await load();
    alert(`Deleted ${nick}.\n\n` + Object.entries(removed).map(([t, n]) => `${t}: ${n}`).join("\n"));
  } catch (err) { say(err.message); }
};

$("#q").oninput = () => { clearTimeout(timer); timer = setTimeout(load, 200); };
$("#refresh").onclick = load;
load().catch((err) => { document.body.textContent = "Can't reach the server: " + err.message; });
</script>
</body>
</html>
